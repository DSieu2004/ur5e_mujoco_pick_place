controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ur5e_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController

ur5e_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 8.0
      # Match the 0.5 rad trajectory tolerance verified on the running controller.
      # Keep the tighter goal tolerance so each segment still settles accurately.
      shoulder_pan_joint: {trajectory: 0.5, goal: 0.05}
      shoulder_lift_joint: {trajectory: 0.5, goal: 0.05}
      elbow_joint: {trajectory: 0.5, goal: 0.05}
      wrist_1_joint: {trajectory: 0.5, goal: 0.05}
      wrist_2_joint: {trajectory: 0.5, goal: 0.05}
      wrist_3_joint: {trajectory: 0.5, goal: 0.05}

gripper_controller:
  ros__parameters:
    joint: gripper_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.02
    max_effort: 5.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
